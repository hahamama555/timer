
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>LIVE カウントダウンタイマー</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #111;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 96dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.top {
  text-align: center;
  padding-top: 6px;
}

.title {
  font-size: clamp(18px, 5vw, 25px);
  font-weight: 900;
  letter-spacing: 1px;
}

.status {
  margin-top: 7px;
  color: #bbb;
  font-size: 14px;
}

.timer-area {
  flex: 1;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid #333;
  border-radius: 22px;
  background: #191919;
  padding: 10px 2px;
  overflow: hidden;
}

.timer {
  width: 100%;
  text-align: center;
  white-space: nowrap;
  font-size: clamp(48px, 15vw, 100px);
  font-weight: 900;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  color: #fff;
}

.timer.negative {
  color: #ff5252;
}

.timer-label {
  margin-top: 12px;
  color: #999;
  font-size: 12px;
  text-align: center;
}

.controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

button {
  border: none;
  border-radius: 13px;
  min-height: 48px;
  padding: 10px 5px;
  color: #fff;
  font-size: clamp(15px, 4vw, 19px);
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
  opacity: .85;
}

.plus {
  background: #176b42;
}

.minus {
  background: #9b3030;
}

.main-buttons {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 7px;
}

.start {
  background: #087fdb;
}

.pause {
  background: #555;
}

.reset {
  background: #333;
  border: 1px solid #666;
}

.settings {
  padding: 10px;
  border-radius: 13px;
  background: #1c1c1c;
}

.settings-title {
  font-size: 13px;
  color: #ccc;
  margin-bottom: 7px;
}

.setting-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

input {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #080808;
  color: #fff;
  font-size: 18px;
}

.set-button {
  min-width: 82px;
  min-height: 44px;
  background: #444;
  font-size: 14px;
}

.hint {
  color: #888;
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
  padding-bottom: 3px;
}

@media (max-height: 700px) {
  .app {
    min-height: 96dvh;
    gap: 7px;
  }

  .timer-area {
    min-height: 130px;
  }

  button {
    min-height: 40px;
    padding: 7px 4px;
  }

  .settings {
    padding: 7px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="top">
    <div class="title">LIVE TIMER</div>
    <div class="status" id="status">スタート待ち</div>
  </div>

  <div class="timer-area">
    <div class="timer" id="timer">10:00</div>
    <div class="timer-label">0秒で音が鳴り、マイナス計測を継続</div>
  </div>

  <div class="controls">
    <button class="plus" data-delta="10">＋10秒</button>
    <button class="minus" data-delta="-10">−10秒</button>

    <button class="plus" data-delta="30">＋30秒</button>
    <button class="minus" data-delta="-30">−30秒</button>

    <button class="plus" data-delta="60">＋1分</button>
    <button class="minus" data-delta="-60">−1分</button>

    <button class="plus" data-delta="600">＋10分</button>
    <button class="minus" data-delta="-600">−10分</button>

    <button class="plus" data-delta="3600">＋1時間</button>
    <button class="minus" data-delta="-3600">−1時間</button>
  </div>

  <div class="main-buttons">
    <button class="start" id="startBtn">▶ スタート</button>
    <button class="pause" id="pauseBtn">⏸ 一時停止</button>
    <button class="reset" id="resetBtn">↺ リセット</button>
  </div>

  <div class="settings">
    <div class="settings-title">初期時間を設定（分）</div>
    <div class="setting-row">
      <input id="minutesInput" type="number" min="0" step="1"
             value="10" inputmode="numeric" aria-label="初期時間（分）">
      <button class="set-button" id="setBtn">時間設定</button>
    </div>
  </div>

  <div class="hint">
    ギフトに合わせて時間を調整できます。<br>
    0秒以降もマイナス方向に計測し続けます。
  </div>

</div>

<script>
(() => {
  const timerEl = document.getElementById("timer");
  const statusEl = document.getElementById("status");
  const minutesInput = document.getElementById("minutesInput");

  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const resetBtn = document.getElementById("resetBtn");
  const setBtn = document.getElementById("setBtn");

  let left = 600;
  let initialSeconds = 600;
  let deadline = 0;
  let running = false;
  let intervalId = null;
  let alarmPlayed = false;
  let audioContext = null;

  function formatTime(seconds) {
    const negative = seconds < 0;
    const total = Math.floor(Math.abs(seconds));

    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = total % 60;

    const pad = n => String(n).padStart(2, "0");

    let formatted;

    if (hours > 0) {
      formatted = `${pad(hours)}:${pad(minutes)}:${pad(secs)}`;
    } else {
      formatted = `${pad(minutes)}:${pad(secs)}`;
    }

    return (negative ? "-" : "") + formatted;
  }

  function paint() {
    timerEl.textContent = formatTime(left);
    timerEl.classList.toggle("negative", left < 0);

    if (running && left > 0) {
      statusEl.textContent = "カウントダウン中";
    } else if (running && left <= 0) {
      statusEl.textContent = "マイナス計測中";
    } else if (!running && left < 0) {
      statusEl.textContent = "一時停止中（マイナス）";
    } else if (!running && left === 0) {
      statusEl.textContent = "0秒";
    } else if (!running) {
      statusEl.textContent = "一時停止中／スタート待ち";
    }
  }

  function playAlarm() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      if (!audioContext) {
        audioContext = new AudioCtx();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const startAt = audioContext.currentTime;

      [880, 660, 880].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const time = startAt + index * 0.28;

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(0.25, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.22);

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(time);
        oscillator.stop(time + 0.23);
      });
    } catch (error) {
      console.log("音声を再生できませんでした", error);
    }
  }

  function checkZero() {
    if (left <= 0 && !alarmPlayed) {
      alarmPlayed = true;
      playAlarm();
    }
  }

  function updateFromClock() {
    if (!running) return;

    left = (deadline - Date.now()) / 1000;
    checkZero();
    paint();
  }

  function startTimer() {
    if (running) return;

    running = true;
    deadline = Date.now() + left * 1000;

    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }

    updateFromClock();
    intervalId = window.setInterval(updateFromClock, 100);
    paint();
  }

  function pauseTimer() {
    if (!running) return;

    left = (deadline - Date.now()) / 1000;
    running = false;

    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }

    paint();
  }

  function resetTimer() {
    running = false;

    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }

    left = initialSeconds;
    alarmPlayed = false;
    deadline = 0;

    paint();
  }

  function adjustTime(delta) {
    if (running) {
      left = (deadline - Date.now()) / 1000;
    }

    left = Math.ceil(left) + delta;

    // 正の時間に戻った場合、次の0秒到達時に再び鳴らす
    if (left > 0) {
      alarmPlayed = false;
    }

    if (running) {
      deadline = Date.now() + left * 1000;
    }

    checkZero();
    paint();
  }

  document.querySelectorAll("[data-delta]").forEach(button => {
    button.addEventListener("click", () => {
      adjustTime(Number(button.dataset.delta));
    });
  });

  startBtn.addEventListener("click", startTimer);
  pauseBtn.addEventListener("click", pauseTimer);
  resetBtn.addEventListener("click", resetTimer);

  setBtn.addEventListener("click", () => {
    const value = Number(minutesInput.value);

    if (
      minutesInput.value.trim() === "" ||
      !Number.isFinite(value) ||
      value < 0
    ) {
      alert("0以上の分数を入力してください");
      return;
    }

    initialSeconds = Math.floor(value * 60);
    left = initialSeconds;
    alarmPlayed = false;

    if (running) {
      deadline = Date.now() + left * 1000;
    }

    checkZero();
    paint();
  });

  paint();
})();
</script>
</body>
</html>
